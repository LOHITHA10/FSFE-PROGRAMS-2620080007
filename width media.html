<html>
<head>
    <title>
        FlexBox Example</title>
        <style>
            .container {|
            display:flex;
            flex-direction: row;
            gap: 20px;
            justify-content:center;
            align-items: center;
            background-color:aqua;
            padding: 20px;
            }
        .card {
            width: 180px;
            padding: 20px;
            background-color:aliceblue;
            border: 2px solid blue;
            text-align: center;
        }
        @media (max-width: 900px) {
            .box{
                width: 100%;
                background-color: lightblue;
            }}
            @media (max-width: 720PX) {
                .box{
                    Width: 100%
                    background-color: blue;
            
        }
        </style></head><body>
            <h1>ABC College Departements</h1>
            <div class="container">
                <div class="card">
                    <h2>AIDS</h2>
                    <p>Computer Science</p>
                    <div class="container">
                <div class="card">
                    <h2>EEE</h2>
                    <p>Computer Science</p>
                    <div class="container">
                <div class="card">
                    <h2>ECE</h2>
                    <p>Computer Science</p>
                </div></div></div></body>
                        </html>
