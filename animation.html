<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moving Box</title>
    <style>
        body {
            margin: 0;
        }

        .box {
            width: 120px;
            height: 120px;
            background-color: lightblue;
            animation-name: moveBox;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }

        @keyframes moveBox {
            from {
                transform: translateX(200px);
            }
            to {
                transform: translateX(800px);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
