<html>
    <head>
        <style>
            body {
                font-family: Arial,
                 sans-serif;
                 line-height: 1.5;
         }
           .tight {
                line-height: 15;
            }
            .loose{
                line-height: 1.8;
            }
            .light {
                font-weight: 300;
            }
            .bold {
                font-weight: 900;
            }</style></head><body>
                <p class="tight">
                    Tight line-height makes text harder to read when context is long.
                </p>
                <p class="loose">
                    Loose line-height improves readability, especially in longer passages.
                </p>
                <p class="light">
                    Light font weight is suitable and modern.
                </p>
                <p class="bold">
                    Bold font weight is good for headings and emphasis.
                </p></body></html>
